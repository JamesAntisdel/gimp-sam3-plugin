[pytest]
# Repo-root pytest configuration.  `python3 -m pytest` from the repo root must
# pass on a machine with no GPU, no torch, no GIMP and no SAM 3 weights, on any
# Python from 3.10 up.  Anything that needs those must carry a marker below and
# skip.
testpaths = tests

# Import paths.  `plugin/sam3_gimp/_daemon` makes `import sam3gimpd` work;
# `plugin/sam3_gimp` makes the plug-in's modules importable as TOP-LEVEL
# modules (`import client`, `import launcher`, `from ui import canvas`), which
# is exactly how they are imported inside GIMP once sam3_gimp.py puts its own
# directory on sys.path.  `plugin` is also present so `from sam3_gimp import
# ...` works.  tests/ is on the path for shared helpers such as tests/fake_gimp.
pythonpath = plugin/sam3_gimp/_daemon plugin plugin/sam3_gimp tests

# importlib mode: no __init__.py required in test directories, and identically
# named test modules in tests/daemon, tests/plugin and tests/fake_gimp do not
# collide.
addopts = -q --strict-markers --import-mode=importlib
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    needs_torch: requires torch (and usually transformers) to be importable; skipped otherwise
    needs_gpu: requires a real CUDA/MPS device; skipped otherwise (implies needs_torch)
    needs_weights: requires the gated facebook/sam3 checkpoint on disk; skipped otherwise
    needs_gimp: requires gi.repository.Gimp, i.e. running inside GIMP; skipped otherwise
    needs_gtk: requires GTK3 + PyGObject + a display; skipped otherwise
    needs_daemon: spawns or talks to a real sam3gimpd process over loopback
    slow: takes more than a couple of seconds

filterwarnings =
    default
    ignore::DeprecationWarning:importlib._bootstrap
